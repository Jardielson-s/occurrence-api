name: "Code Review by Gemini AI"

on:
  pull_request:

jobs:
  review:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # 👈 Baixa todo o histórico para o git diff funcionar

      - name: Gemini Code review Github Action
        uses: sshnaidm/gemini-code-review-action@v2
        with:
          gemini-key: ${{ secrets.GEMINI_API_KEY }}
          model: gemini-2.5-pro
          context-lines: 15
          review-title: "🤖 Gemini AI - Revisão de Código"
          prompt: |
            Você é um engenheiro de software sênior e especialista em segurança.
            Analise o código modificado na Pull Request e forneça feedback construtivo.

            Diretrizes:
            1. Escreva todas as respostas obrigatoriamente em Português Brasileiro (pt-BR).
            2. Foque em detecção de bugs, vulnerabilidades de segurança (OWASP),
               performance e Clean Code.
            3. Se o código estiver excelente, elogie brevemente.
